<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Flow TV Player Híbrido</title>
    <style>
        /* --- FONDO 100% TRANSPARENTE PARA VER EXOPLAYER DETRÁS --- */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: transparent !important; 
            overflow: hidden; font-family: sans-serif; color: white; 
        }
        
        /* --- PANTALLA DE CARGA CON LOGO --- */
        #loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #loading-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #loading-logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
            animation: pulse 1.5s infinite alternate;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid #E50914;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(0.95); } 100% { transform: scale(1.05); } }

        /* --- MENSAJES EN PANTALLA (OSD) --- */
        #osd-message {
            position: absolute;
            top: 30px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #333;
            padding: 10px 25px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
        }
    </style>
</head>
<body>
    <!-- Pantalla de Carga con Logo -->
    <div id="loading-overlay">
        <img id="loading-logo" src="" alt="Cargando...">
        <div class="loading-spinner"></div>
    </div>

    <div id="osd-message"></div>

    <script>
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingLogo = document.getElementById('loading-logo');
        const osd = document.getElementById('osd-message');
        let timeoutOsd;

        function showOsd(mensaje) {
            osd.innerText = mensaje;
            osd.style.opacity = 1;
            clearTimeout(timeoutOsd);
            timeoutOsd = setTimeout(() => { osd.style.opacity = 0; }, 3000);
        }

        // Esta función atrapa la orden del botón Atrás
        function handleBackButton() {
            // Le pedimos a Kotlin que abra el menú lateral de canales
            if (window.Android) window.Android.openGuide();
        }

        // Esta es la nueva función que recibe Kotlin
        // Solo dibuja el logo en pantalla mientras ExoPlayer arranca por detrás
        function prepararInterfaz(logoUrl) {
            if (logoUrl) {
                loadingLogo.src = logoUrl;
                loadingLogo.style.display = 'block';
            } else {
                loadingLogo.style.display = 'none';
            }
            loadingOverlay.classList.add('visible');
            
            // Ocultar la pantalla de carga después de 2.5 segundos
            setTimeout(() => {
                loadingOverlay.classList.remove('visible');
            }, 2500);
        }

        // Detectar teclas en el control remoto para abrir el menú
        document.addEventListener('keydown', (e) => {
            // Si presionan OK/Enter o los botones de dirección, podemos abrir la guía
            if (e.key === 'Enter' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                if (window.Android) window.Android.openGuide();
            }
        });
    </script>
</body>
</html>
