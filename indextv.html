<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Flow TV Player</title>
    <!-- Motor de Shaka Player -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #000; overflow: hidden; font-family: sans-serif; color: white; 
        }
        #video-container { width: 100%; height: 100%; position: relative; }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }
        
        /* --- PANTALLA DE CARGA CON LOGO --- */
        #loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #loading-overlay.visible { opacity: 1; pointer-events: auto; }
        #loading-logo {
            width: 140px; height: 140px; object-fit: contain;
            filter: drop-shadow(0 4px 15px rgba(0,0,0,0.7));
        }
        .loading-spinner {
            width: 50px; height: 50px;
            border: 5px solid rgba(255,255,255,0.2);
            border-top: 5px solid #E50914;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- MENSAJES EN PANTALLA (OSD) --- */
        #osd-message {
            position: absolute;
            top: 40px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #E50914;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 22px; font-weight: bold;
            opacity: 0; transition: opacity 0.3s ease;
            z-index: 100;
        }
        
        /* --- PANEL DE INFORMACIÓN (STATS) --- */
        #info-panel {
            position: absolute; top: 40px; right: 40px;
            background: rgba(15, 15, 15, 0.9);
            border-left: 6px solid #E50914;
            padding: 20px; border-radius: 6px;
            display: flex; flex-direction: column; gap: 12px;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
            z-index: 15;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #info-panel.visible { opacity: 1; }
        .info-row { display: flex; justify-content: space-between; align-items: center; gap: 50px; }
        .info-label { color: #999; font-size: 14px; font-weight: bold; letter-spacing: 1.5px; }
        .info-value { color: #FFF; font-size: 18px; font-weight: bold; }
        
        /* --- INDICADOR DE VERSIÓN --- */
        .info-version {
            margin-top: 5px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            text-align: right;
            font-size: 12px;
            color: #777;
            letter-spacing: 1px;
        }

        /* --- CONTROLES DE REPRODUCCIÓN (BARRA INFERIOR TV) --- */
        #tv-controls {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
            padding: 50px 30px 30px 30px;
            display: flex; flex-direction: column; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 20;
        }
        #tv-controls.visible { opacity: 1; pointer-events: auto; }
        .time-text { font-size: 24px; font-weight: bold; margin-bottom: 20px; text-shadow: 2px 2px 4px #000; }
        .botones-row { display: flex; gap: 20px; }
        
        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid transparent; 
            border-radius: 50%;
            width: 75px; height: 75px;
            display: flex; justify-content: center; align-items: center;
            font-size: 30px; outline: none; cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }
        .btn:focus {
            background: #E50914 !important;
            border: 3px solid #FFFFFF !important;
            transform: scale(1.2);
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.8);
        }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="video" autoplay></video>
        
        <div id="loading-overlay">
            <img id="loading-logo" src="" alt="Cargando...">
            <div class="loading-spinner"></div>
        </div>

        <div id="osd-message"></div>
        
        <!-- PANEL DE ESTADÍSTICAS Y VERSIÓN -->
        <div id="info-panel">
            <div class="info-row"><span class="info-label">AUDIO</span><span class="info-value" id="info-audio">Único disponible</span></div>
            <div class="info-row"><span class="info-label">SUBTÍTULOS</span><span class="info-value" id="info-subs">No disponibles</span></div>
            <div class="info-row"><span class="info-label">CALIDAD</span><span class="info-value" id="info-qual">AUTO (1080p)</span></div>
            <div class="info-version">Versión 2.1.0</div>
        </div>

        <!-- BARRA INFERIOR DE CONTROLES -->
        <div id="tv-controls">
            <div class="time-text" id="time-display">🔴 EN VIVO</div>
            <div class="botones-row">
                <div class="btn" id="btn-subs" tabindex="0" title="Subtítulos">💬</div>
                <div class="btn" id="btn-rewind" tabindex="0" title="Retroceder">⏪</div>
                <div class="btn" id="btn-playpause" tabindex="0" title="Play/Pausa">⏸️</div>
                <div class="btn" id="btn-forward" tabindex="0" title="Avanzar">⏩</div>
                <div class="btn" id="btn-audio" tabindex="0" title="Audio">🔊</div>
            </div>
        </div>
    </div>

    <script>
        shaka.polyfill.installAll();
        const video = document.getElementById('video');
        window.player = new shaka.Player(video);
        
        window.player.configure({ 
            streaming: { 
                retryParameters: { maxAttempts: 10, timeout: 30000 },
                bufferingGoal: 10,
                rebufferingGoal: 2,
                bufferBehind: 2, // Limpieza automática de RAM para la TV Box
                stallEnabled: true
            },
            preferredAudioLanguage: 'es',
            abr: { enabled: true } 
        });

        const controlsUi = document.getElementById('tv-controls');
        const infoPanel = document.getElementById('info-panel');
        const btnPlay = document.getElementById('btn-playpause');
        const btnRewind = document.getElementById('btn-rewind');
        const btnForward = document.getElementById('btn-forward');
        const btnAudio = document.getElementById('btn-audio');
        const btnSubs = document.getElementById('btn-subs');
        const osd = document.getElementById('osd-message');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingLogo = document.getElementById('loading-logo');

        let timeoutOcultar;
        let timeoutOsd;

        function updateInfoPanelData() {
            const audioEl = document.getElementById('info-audio');
            audioEl.innerText = "Único disponible";

            const textTracks = window.player.getTextTracks();
            const subsEl = document.getElementById('info-subs');
            if (textTracks && textTracks.length > 0) {
                const activeSub = textTracks.find(t => t.active);
                subsEl.innerText = activeSub ? (activeSub.language || "Activos") : "Disponibles";
            } else {
                subsEl.innerText = "No disponibles";
            }

            const qualEl = document.getElementById('info-qual');
            const activeTrack = window.player.getVariantTracks().find(t => t.active);
            const isAbrEnabled = window.player.getConfiguration().abr.enabled;
            
            if (activeTrack && activeTrack.height) {
                qualEl.innerText = (isAbrEnabled ? "AUTO (" : "") + activeTrack.height + "p" + (isAbrEnabled ? ")" : "");
            } else {
                qualEl.innerText = "AUTO (1080p)";
            }
        }

        function showControls() {
            updateInfoPanelData();
            controlsUi.classList.add('visible');
            infoPanel.classList.add('visible'); 
            clearTimeout(timeoutOcultar);
            
            timeoutOcultar = setTimeout(() => {
                controlsUi.classList.remove('visible');
                infoPanel.classList.remove('visible'); 
            }, 6000); 
        }
        
        function showOsd(mensaje) {
            osd.innerText = mensaje;
            osd.style.opacity = 1;
            clearTimeout(timeoutOsd);
            timeoutOsd = setTimeout(() => { osd.style.opacity = 0; }, 3000);
        }

        document.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'Select'].includes(e.key)) {
                if (!controlsUi.classList.contains('visible')) {
                    showControls();
                    btnPlay.focus();
                    e.preventDefault();
                }
            }
        });

        function handleBackButton() {
            if (controlsUi.classList.contains('visible')) {
                controlsUi.classList.remove('visible');
                infoPanel.classList.remove('visible'); 
                clearTimeout(timeoutOcultar);
            } else {
                if (window.Android) window.Android.openGuide();
            }
        }

        video.addEventListener('play', () => { btnPlay.innerText = '⏸️'; });
        video.addEventListener('pause', () => { btnPlay.innerText = '▶️'; });
        
        btnPlay.addEventListener('click', () => { 
            video.paused ? video.play() : video.pause(); 
            showControls(); 
        });
        btnRewind.addEventListener('click', () => { 
            video.currentTime -= 15; 
            showOsd("Retroceder 15s"); 
            showControls(); 
        });
        btnForward.addEventListener('click', () => { 
            video.currentTime += 15; 
            showOsd("Avanzar 15s"); 
            showControls(); 
        });
        btnAudio.addEventListener('click', () => { 
            showOsd("Audio: Único disponible"); 
            showControls(); 
        });
        btnSubs.addEventListener('click', () => { 
            showOsd("Subtítulos: No disponibles"); 
            showControls(); 
        });

        async function playVideo(url, kid, key, logoUrl) {
            try {
                if (logoUrl) {
                    loadingLogo.src = logoUrl;
                    loadingLogo.style.display = 'block';
                } else {
                    loadingLogo.style.display = 'none';
                }
                loadingOverlay.classList.add('visible');

                if (window.player) {
                    await window.player.destroy();
                    window.player = null;
                }

                video.pause();
                video.removeAttribute('src');
                video.load();

                window.player = new shaka.Player(video);
                window.player.configure({ 
                    streaming: { 
                        retryParameters: { maxAttempts: 10, timeout: 30000 },
                        bufferingGoal: 10,
                        rebufferingGoal: 2,
                        bufferBehind: 2,
                        stallEnabled: true
                    },
                    preferredAudioLanguage: 'es',
                    abr: { enabled: true } 
                });

                if (kid && key) {
                    window.player.configure({ drm: { clearKeys: { [kid]: key } } });
                } else {
                    window.player.configure({ drm: { clearKeys: {} } });
                }

                await window.player.load(url);
                video.play();
                
                loadingOverlay.classList.remove('visible');
                window.player.configure({ abr: { enabled: true } });

            } catch (e) {
                console.error("Error al cargar el video:", e);
                setTimeout(() => { playVideo(url, kid, key, logoUrl); }, 2000);
            }
        }
    </script>
</body>
</html>
