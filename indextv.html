<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Flow TV Player</title>
    <!-- Motor de Shaka Player -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: black; overflow: hidden; font-family: sans-serif; color: white; }
        #video-container { width: 100%; height: 100%; position: relative; }
        video { width: 100%; height: 100%; object-fit: contain; }
        /* Oculta cualquier control nativo que Android WebView intente forzar */
video::-webkit-media-controls {
    display:none !important;
}
video::-webkit-media-controls-panel {
    display: none !important;
}
video::-webkit-media-controls-play-button {
    display: none !important;
}
video::-webkit-media-controls-start-playback-button {
    display: none !important;
}
        
        /* --- PANTALLA DE CARGA CON LOGO --- */
        #loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #loading-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #loading-logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
            animation: pulse 1.5s infinite alternate;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid #E50914;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(0.95); } 100% { transform: scale(1.05); } }

        /* --- MENSAJES EN PANTALLA (OSD) --- */
        #osd-message {
            position: absolute;
            top: 30px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #333;
            padding: 10px 25px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
        }
        
        /* --- PANEL DE INFORMACIÓN ELEGANTE --- */
        #info-panel {
            position: absolute;
            top: 40px;
            right: 40px;
            background: rgba(15, 15, 15, 0.85);
            border-left: 5px solid #E50914;
            padding: 20px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: translateY(-10px);
            z-index: 15;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        
        #info-panel.visible { 
            opacity: 1; 
            transform: translateY(0);
        }
        
        .info-row { display: flex; justify-content: space-between; align-items: center; gap: 40px; }
        .info-label { color: #999; font-size: 13px; font-weight: bold; letter-spacing: 1.5px; }
        .info-value { color: #FFF; font-size: 18px; font-weight: bold; text-transform: capitalize; }
        
        /* --- CONTROLES DE REPRODUCCIÓN (BARRA INFERIOR) --- */
        #tv-controls {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
            padding: 40px 20px 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 5;
        }
        
        #tv-controls.visible { opacity: 1; }
        
        .time-text { font-size: 22px; font-weight: bold; margin-bottom: 20px; text-shadow: 2px 2px 4px #000; }
        
        .botones-row { display: flex; gap: 15px; }
        
        .btn {
            background: rgba(255,255,255,0.15);
            border: 3px solid transparent;
            border-radius: 50%;
            width: 70px; height: 70px;
            display: flex; justify-content: center; align-items: center;
            font-size: 28px;
            outline: none;
            cursor: pointer;
        }
        
        .btn:focus {
            background: #E50914;
            border: 3px solid white;
            transform: scale(1.15);
        }

        /* --- MENÚ DE CALIDADES --- */
        #quality-menu {
            position: absolute;
            bottom: 120px;
            right: 40px;
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #444;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            min-width: 160px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 20;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        
        #quality-menu.visible { opacity: 1; pointer-events: auto; }
        
        .q-option { padding: 15px; font-size: 20px; text-align: center; border-bottom: 1px solid #333; outline: none; cursor: pointer; color: #CCC; }
        .q-option:last-child { border-bottom: none; }
        .q-option.active { color: #E50914; font-weight: bold; }
        .q-option:focus { background: #E50914; color: white; font-weight: bold; }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="video" autoplay playsinline webkit-playsinline></video>
        
        <!-- Pantalla de Carga con Logo -->
        <div id="loading-overlay">
            <img id="loading-logo" src="" alt="Cargando...">
            <div class="loading-spinner"></div>
        </div>

        <div id="osd-message"></div>
        
        <!-- CUADRO DE INFORMACIÓN -->
        <div id="info-panel">
            <div class="info-row">
                <span class="info-label">AUDIO</span>
                <span class="info-value" id="info-audio">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">SUBTÍTULOS</span>
                <span class="info-value" id="info-subs">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">CALIDAD</span>
                <span class="info-value" id="info-qual">-</span>
            </div>
        </div>

        <!-- MENÚ DE CALIDADES -->
        <div id="quality-menu"></div>

        <!-- BARRA INFERIOR DE BOTONES -->
        <div id="tv-controls">
            <div class="time-text" id="time-display">🔴 EN VIVO</div>
            <div class="botones-row">
                <div class="btn" id="btn-subs" tabindex="0">💬</div>
                <div class="btn" id="btn-rewind" tabindex="0">⏪</div>
                <div class="btn" id="btn-playpause" tabindex="0">⏸️</div>
                <div class="btn" id="btn-forward" tabindex="0">⏩</div>
                <div class="btn" id="btn-audio" tabindex="0">🔊</div>
                <div class="btn" id="btn-quality" tabindex="0">⚙️</div>
            </div>
        </div>
    </div>

    <script>
        shaka.polyfill.installAll();
        const video = document.getElementById('video');
        window.player = new shaka.Player(video);
        
        window.player.configure({ 
            streaming: { retryParameters: { maxAttempts: 10, timeout: 30000 } },
            preferredAudioLanguage: 'es',
            preferredTextLanguage: 'es',
            abr: { enabled: true } 
        });

        // Referencias a la UI
        const controlsUi = document.getElementById('tv-controls');
        const infoPanel = document.getElementById('info-panel');
        const qualityMenu = document.getElementById('quality-menu');
        const btnPlay = document.getElementById('btn-playpause');
        const btnRewind = document.getElementById('btn-rewind');
        const btnForward = document.getElementById('btn-forward');
        const btnAudio = document.getElementById('btn-audio');
        const btnSubs = document.getElementById('btn-subs');
        const btnQuality = document.getElementById('btn-quality');
        const timeDisplay = document.getElementById('time-display');
        const osd = document.getElementById('osd-message');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingLogo = document.getElementById('loading-logo');

        let timeoutOcultar;
        let timeoutOsd;
        
        let audioLangs = [];
        let currentAudioIdx = 0;
        let subLangs = [];
        let currentSubIdx = -1; 
        let qualityLevels = [];

        // Diccionario de idiomas
        const diccIdiomas = { 'es': 'Español', 'en': 'Inglés', 'pt': 'Portugués', 'fr': 'Francés', 'it': 'Italiano', 'de': 'Alemán' };
        function traducirIdioma(cod) { return diccIdiomas[cod.toLowerCase()] || cod.toUpperCase(); }

        // Actualizar datos del panel de información
        function updateInfoPanelData() {
            let txtAudio = audioLangs.length > 0 ? traducirIdioma(audioLangs[currentAudioIdx]) : "Desconocido";
            let txtSubs = (currentSubIdx !== -1 && subLangs.length > 0) ? traducirIdioma(subLangs[currentSubIdx]) : "Apagados";
            
            let txtQual = "AUTO";
            const isAuto = window.player.getConfiguration().abr.enabled;
            const activeTrack = window.player.getVariantTracks().find(t => t.active);
            if (activeTrack && activeTrack.height) {
                txtQual = isAuto ? "AUTO (" + activeTrack.height + "p)" : activeTrack.height + "p";
            }

            document.getElementById('info-audio').innerText = txtAudio;
            document.getElementById('info-subs').innerText = txtSubs;
            document.getElementById('info-qual').innerText = txtQual;
        }

        // Mostrar controles
        function showControls() {
            updateInfoPanelData(); 
            controlsUi.classList.add('visible');
            infoPanel.classList.add('visible'); 
            clearTimeout(timeoutOcultar);
            
            timeoutOcultar = setTimeout(() => {
                controlsUi.classList.remove('visible');
                infoPanel.classList.remove('visible'); 
                qualityMenu.classList.remove('visible'); 
            }, 5000); 
        }
        
        // Mensaje emergente (OSD)
        function showOsd(mensaje) {
            osd.innerText = mensaje;
            osd.style.opacity = 1;
            clearTimeout(timeoutOsd);
            timeoutOsd = setTimeout(() => { osd.style.opacity = 0; }, 3000);
        }

        // Puente con Kotlin para el botón ATRÁS del control
        function handleBackButton() {
            if (qualityMenu.classList.contains('visible')) {
                qualityMenu.classList.remove('visible');
                btnQuality.focus();
            } else if (controlsUi.classList.contains('visible')) {
                controlsUi.classList.remove('visible');
                infoPanel.classList.remove('visible'); 
                clearTimeout(timeoutOcultar);
            } else {
                if (window.Android) window.Android.openGuide();
            }
        }

        function formatTime(sec) {
            if (isNaN(sec) || !isFinite(sec)) return "00:00";
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = Math.floor(sec % 60);
            if (h > 0) return h + ':' + m.toString().padStart(2, '0') + ':' + s.toString().padStart(2, '0');
            return m.toString().padStart(2, '0') + ':' + s.toString().padStart(2, '0');
        }

        // Actualizar texto de calidad en tiempo real
        function updateActiveQualityDisplay() {
            updateInfoPanelData(); 
            const activeTrack = window.player.getVariantTracks().find(t => t.active);
            const autoOpt = document.getElementById('opt-auto');
            if (activeTrack && activeTrack.height && autoOpt) {
                const isAuto = window.player.getConfiguration().abr.enabled;
                autoOpt.innerText = isAuto ? 'AUTO (' + activeTrack.height + 'p)' : 'AUTO';
            }
        }

        window.player.addEventListener('adaptation', updateActiveQualityDisplay);
        window.player.addEventListener('variantchanged', updateActiveQualityDisplay);

        // Lógica de tiempo y en vivo
        video.addEventListener('timeupdate', () => {
            if (window.player.isLive()) {
                timeDisplay.innerText = "🔴 EN VIVO";
            } else {
                timeDisplay.innerText = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
            }
        });

        video.addEventListener('play', () => { btnPlay.innerText = '⏸️'; });
        video.addEventListener('pause', () => { btnPlay.innerText = '▶️'; });

        // Eventos de botones
        btnPlay.addEventListener('click', () => { video.paused ? video.play() : video.pause(); showControls(); });
        btnRewind.addEventListener('click', () => { video.currentTime -= 15; showControls(); });
        btnForward.addEventListener('click', () => { video.currentTime += 15; showControls(); });

        btnAudio.addEventListener('click', () => {
            if (audioLangs.length <= 1) {
                showOsd("Único audio disponible");
            } else {
                currentAudioIdx = (currentAudioIdx + 1) % audioLangs.length;
                const newLang = audioLangs[currentAudioIdx];
                window.player.selectAudioLanguage(newLang);
                showOsd("Audio: " + traducirIdioma(newLang));
            }
            showControls();
        });

        btnSubs.addEventListener('click', () => {
            if (subLangs.length === 0) {
                showOsd("Sin subtítulos");
            } else {
                currentSubIdx++;
                if (currentSubIdx >= subLangs.length) {
                    currentSubIdx = -1;
                    window.player.setTextTrackVisibility(false);
                    showOsd("Subtítulos: Apagados");
                } else {
                    const newLang = subLangs[currentSubIdx];
                    window.player.selectTextLanguage(newLang);
                    window.player.setTextTrackVisibility(true);
                    showOsd("Subtítulos: " + traducirIdioma(newLang));
                }
            }
            showControls();
        });

        // Menú de calidades
        btnQuality.addEventListener('click', () => {
            if (qualityMenu.classList.contains('visible')) {
                qualityMenu.classList.remove('visible');
            } else {
                updateActiveQualityDisplay(); 
                qualityMenu.classList.add('visible');
                const activeOption = qualityMenu.querySelector('.active') || qualityMenu.firstElementChild;
                if (activeOption) activeOption.focus();
            }
            showControls();
        });

        function selectQuality(value, element) {
            document.querySelectorAll('.q-option').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            if (value === 'auto') {
                window.player.configure({ abr: { enabled: true } });
                showOsd("Calidad: AUTO");
            } else {
                window.player.configure({ abr: { enabled: false } });
                const tracks = window.player.getVariantTracks();
                const tracksWithHeight = tracks.filter(t => t.height === value);
                tracksWithHeight.sort((a, b) => b.bandwidth - a.bandwidth);
                if (tracksWithHeight.length > 0) {
                    window.player.selectVariantTrack(tracksWithHeight[0], true);
                    showOsd("Calidad: " + value + "p");
                }
            }
            
            updateActiveQualityDisplay();
            qualityMenu.classList.remove('visible');
            btnQuality.focus();
        }

        // Detección del control remoto
        document.addEventListener('keydown', (e) => {
            showControls();
            if (!controlsUi.classList.contains('visible') || document.activeElement.tagName !== 'DIV') {
                btnPlay.focus();
            }
        });

        // Función de inicialización desde Kotlin
        async function playVideo(url, kid, key, logoUrl) {
            try {
                if (logoUrl) {
                    loadingLogo.src = logoUrl;
                    loadingLogo.style.display = 'block';
                } else {
                    loadingLogo.style.display = 'none';
                }
                loadingOverlay.classList.add('visible');

                await window.player.unload();

                if (kid && key) {
                    window.player.configure({ drm: { clearKeys: { [kid]: key } } });
                } else {
                    window.player.configure({ drm: { clearKeys: {} } });
                }

                await window.player.load(url);
                video.play();
                
                loadingOverlay.classList.remove('visible');

                const tracks = window.player.getVariantTracks();
                audioLangs = [...new Set(tracks.map(t => t.language))].filter(Boolean);
                currentAudioIdx = Math.max(0, audioLangs.indexOf('es')); 
                
                const textTracks = window.player.getTextTracks();
                subLangs = [...new Set(textTracks.map(t => t.language))].filter(Boolean);
                currentSubIdx = -1;
                window.player.setTextTrackVisibility(false);
                
                qualityLevels = [...new Set(tracks.map(t => t.height).filter(h => h > 0))].sort((a, b) => b - a);
                
                if (typeof qualityMenu !== 'undefined') {
                    qualityMenu.innerHTML = ''; 
                    const autoOpt = document.createElement('div');
                    autoOpt.id = 'opt-auto'; 
                    autoOpt.className = 'q-option active';
                    autoOpt.innerText = 'AUTO';
                    autoOpt.tabIndex = 0;
                    autoOpt.onclick = () => selectQuality('auto', autoOpt);
                    qualityMenu.appendChild(autoOpt);
                    
                    qualityLevels.forEach(h => {
                        const opt = document.createElement('div');
                        opt.className = 'q-option';
                        opt.innerText = h + 'p';
                        opt.tabIndex = 0;
                        opt.onclick = () => selectQuality(h, opt);
                        qualityMenu.appendChild(opt);
                    });
                }

                window.player.configure({ abr: { enabled: true } });
                setTimeout(updateInfoPanelData, 1500);

            } catch (e) {
                console.error("Error al cargar el video:", e);
                setTimeout(() => { playVideo(url, kid, key, logoUrl); }, 2000);
            }
        }
    </script>
</body>
</html>
