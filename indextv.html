<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Flow TV Player</title>
    <!-- Motor de Shaka Player -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; color: white; }
        #video-container { width: 100%; height: 100%; position: relative; }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }
        
        /* --- PANTALLA DE CARGA CON LOGO --- */
        #loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #loading-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #loading-logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
            animation: pulse 1.5s infinite alternate;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid #E50914;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(0.95); } 100% { transform: scale(1.05); } }

        #osd-message {
            position: absolute;
            top: 30px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #333;
            padding: 10px 25px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="video" autoplay></video>
        
        <div id="loading-overlay">
            <img id="loading-logo" src="" alt="Cargando...">
            <div class="loading-spinner"></div>
        </div>

        <div id="osd-message"></div>
    </div>

    <script>
        shaka.polyfill.installAll();
        const video = document.getElementById('video');
        window.player = new shaka.Player(video);
        
        window.player.configure({ 
            streaming: { 
                retryParameters: { maxAttempts: 10, timeout: 30000 },
                bufferingGoal: 10,
                rebufferingGoal: 2,
                bufferBehind: 2, // <-- Limpia la RAM para que nunca se clave por horas de uso
                stallEnabled: true
            },
            preferredAudioLanguage: 'es',
            preferredTextLanguage: 'es',
            abr: { enabled: true } 
        });

        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingLogo = document.getElementById('loading-logo');
        const osd = document.getElementById('osd-message');
        let timeoutOsd;

        function showOsd(mensaje) {
            osd.innerText = mensaje;
            osd.style.opacity = 1;
            clearTimeout(timeoutOsd);
            timeoutOsd = setTimeout(() => { osd.style.opacity = 0; }, 3000);
        }

        function handleBackButton() {
            if (window.Android) window.Android.openGuide();
        }

        async function playVideo(url, kid, key, logoUrl) {
            try {
                if (logoUrl) {
                    loadingLogo.src = logoUrl;
                    loadingLogo.style.display = 'block';
                } else {
                    loadingLogo.style.display = 'none';
                }
                loadingOverlay.classList.add('visible');

                if (window.player) {
                    await window.player.destroy();
                    window.player = null;
                }

                video.pause();
                video.removeAttribute('src');
                video.load();

                window.player = new shaka.Player(video);
                window.player.configure({ 
                    streaming: { 
                        retryParameters: { maxAttempts: 10, timeout: 30000 },
                        bufferingGoal: 10,
                        rebufferingGoal: 2,
                        bufferBehind: 2,
                        stallEnabled: true
                    },
                    preferredAudioLanguage: 'es',
                    preferredTextLanguage: 'es',
                    abr: { enabled: true } 
                });

                if (kid && key) {
                    window.player.configure({ drm: { clearKeys: { [kid]: key } } });
                } else {
                    window.player.configure({ drm: { clearKeys: {} } });
                }

                await window.player.load(url);
                video.play();
                
                loadingOverlay.classList.remove('visible');
                window.player.configure({ abr: { enabled: true } });

            } catch (e) {
                console.error("Error al cargar el video:", e);
                setTimeout(() => { playVideo(url, kid, key, logoUrl); }, 2000);
            }
        }
    </script>
</body>
</html>
