<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TV Player v1.3-KAI</title>
    <!-- Mux.js para soporte de streams MPEG-2 TS (HLS) en navegadores de Windows -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mux.js/6.0.1/mux.min.js"></script>
    <!-- Shaka Player UI CSS y JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
    <style>
        /* Estructura general de la pantalla */
        body { 
            margin: 0; 
            background-color: #0f0f0f; 
            color: #fff; 
            display: flex; 
            flex-direction: row;
            height: 100vh; 
            width: 100vw;
            font-family: sans-serif; 
            overflow: hidden; 
        }
        
        /* Menú lateral con ancho fijo garantizado */
        #sidebar { 
            width: 350px; 
            min-width: 350px; 
            max-width: 350px;
            background: #181818; 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
            flex-shrink: 0;
            z-index: 10;
        }

        #search-input { 
            padding: 15px; 
            background: #222; 
            border: none; 
            color: #fff; 
            outline: none; 
            font-size: 1rem; 
            border-bottom: 1px solid #333; 
        }

        #channel-list { 
            overflow-y: auto; 
            flex: 1; 
            padding: 10px; 
        }
        
        .category-header {
            background: #2a2a2a;
            color: #d1d1d1;
            padding: 12px;
            font-weight: bold;
            font-size: 0.85rem;
            margin-top: 5px;
            margin-bottom: 2px;
            border-radius: 4px;
            border-left: 4px solid #007bff;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            transition: background 0.2s;
        }
        .category-header:hover { background: #353535; }
        
        .category-channels {
            display: none;
            padding-left: 5px;
        }
        .category-channels.open {
            display: block;
        }

        /* Estilos de las Subcategorías (Provincias / Carpetas anidadas) */
        .subcategory-header {
            background: #232328;
            color: #d1d1d8;
            padding: 9px 12px;
            margin: 4px 0 2px 8px;
            font-size: 0.82rem;
            font-weight: 600;
            border-radius: 4px;
            border-left: 3px solid #ff9800;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            transition: background 0.2s;
        }
        .subcategory-header:hover {
            background: #2e2e38;
            color: #fff;
        }
        .subcategory-channels {
            display: none;
            padding-left: 8px;
        }
        .subcategory-channels.open {
            display: block;
        }

        .channel-item { 
            display: flex; 
            align-items: center; 
            padding: 8px 12px; 
            background: #1e1e1e; 
            margin-bottom: 4px; 
            cursor: pointer; 
            border-radius: 6px; 
            transition: background 0.2s, border-color 0.2s;
            border-left: 3px solid transparent;
        }
        .channel-item:hover { background: #333; }
        .channel-item.active {
            background: #252d3a;
            border-left: 3px solid #0078d4;
        }
        
        .channel-icon {
            width: 36px;
            height: 36px;
            object-fit: contain;
            margin-right: 12px;
            border-radius: 4px;
            background: transparent;
            flex-shrink: 0;
        }
        
        .channel-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            justify-content: center;
        }

        .channel-name {
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-chips {
            display: flex;
            gap: 5px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .source-chip {
            font-size: 0.68rem;
            padding: 1px 6px;
            border-radius: 4px;
            background: #2b2b2b;
            color: #aaa;
            border: 1px solid #444;
            transition: all 0.2s;
            cursor: pointer;
            user-select: none;
        }
        .source-chip:hover {
            background: #444;
            color: #fff;
            border-color: #666;
        }
        .source-chip.active {
            background: #0078d4;
            color: #fff;
            border-color: #0098ff;
            font-weight: bold;
        }

        /* Contenedor del reproductor */
        #player-container { 
            flex: 1; 
            height: 100vh; 
            background: #000; 
            position: relative; 
            overflow: hidden; 
        }

        /* Ajuste de Shaka UI para no solapar el menú lateral */
        .shaka-video-container {
            width: calc(100% - 350px) !important;
            height: 100% !important;
            position: absolute !important;
            top: 0;
            left: 350px !important;
        }

        video { 
            width: 100% !important; 
            height: 100% !important; 
            object-fit: contain !important; 
        }

        /* Overlay flotante para selección de fuentes en el reproductor */
        #sources-overlay {
            position: absolute;
            top: 20px;
            right: 25px;
            z-index: 2147483640;
            pointer-events: auto;
            display: flex;
            align-items: center;
            transition: opacity 0.3s ease;
        }
        .sources-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(18, 18, 18, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 6px 12px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
        }
        .sources-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #e0e0e0;
            margin-right: 4px;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .sources-buttons-list {
            display: flex;
            gap: 6px;
        }
        .source-btn {
            background: rgba(255, 255, 255, 0.12);
            color: #ddd;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }
        .source-btn:hover {
            background: rgba(255, 255, 255, 0.28);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.45);
        }
        .source-btn.active {
            background: #0078d4;
            color: #fff;
            border-color: #0098ff;
            box-shadow: 0 0 10px rgba(0, 120, 212, 0.6);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <input type="text" id="search-input" placeholder="Buscar canal..." oninput="filter()">
        <div id="channel-list">Cargando canales...</div>
    </div>
    
    <!-- Contenedor necesario para Shaka UI -->
    <div id="player-container" data-shaka-player-container style="position: relative; width: 100%; height: 100%;">
        <video id="video" autoplay muted data-shaka-player style="width: 100%; height: 100%; object-fit: contain;"></video>
        <!-- Overlay flotante para selección de fuentes -->
        <div id="sources-overlay" style="display: none;" onpointerdown="event.stopPropagation()" onmousedown="event.stopPropagation()" onclick="event.stopPropagation()">
            <div class="sources-badge" onpointerdown="event.stopPropagation()" onmousedown="event.stopPropagation()" onclick="event.stopPropagation()">
                <span class="sources-label">📡 Fuentes:</span>
                <div id="sources-buttons" class="sources-buttons-list" onpointerdown="event.stopPropagation()" onmousedown="event.stopPropagation()" onclick="event.stopPropagation()"></div>
            </div>
        </div>
    </div>

    <script>
        let player = null, ui = null, categoriesData = [];
        let allChannels = [];
        let currentChannel = null;
        let currentSourceIndex = 0;
        let currentChannelSources = [];
        let hasUserInteracted = false;
        let preferredMuted = false;

        document.addEventListener('click', () => {
            hasUserInteracted = true;
        }, { once: false });

        // Extraer fuentes disponibles del canal
        function getChannelSources(ch) {
            if (!ch) return [];
            const sources = [];
            const add = (rawUrl, name) => {
                if (!rawUrl || typeof rawUrl !== 'string') return;
                const u = rawUrl.trim();
                if (u && !sources.some(s => s.url === u)) {
                    sources.push({ url: u, name });
                }
            };
            add(ch.original_url || ch.url, 'Fuente 1');
            add(ch.url1, 'Fuente 2');
            add(ch.url2, 'Fuente 3');
            add(ch.url3, 'Fuente 4');
            return sources;
        }

        let hideSourcesTimer = null;

        // Actualiza el menú flotante de fuentes en el reproductor
        function updateSourcesUI() {
            const overlay = document.getElementById('sources-overlay');
            const container = document.getElementById('sources-buttons');
            if (!overlay || !container) return;

            if (!currentChannelSources || currentChannelSources.length <= 1) {
                overlay.style.display = 'none';
                container.innerHTML = '';
                return;
            }

            overlay.style.display = 'flex';
            overlay.style.opacity = '1';
            overlay.style.pointerEvents = 'auto';
            container.innerHTML = currentChannelSources.map((s, idx) => {
                const isActive = idx === currentSourceIndex;
                return `<button type="button" class="source-btn ${isActive ? 'active' : ''}" onpointerdown="event.stopPropagation()" onmousedown="event.stopPropagation()" onclick="event.stopPropagation(); event.preventDefault(); switchSource(${idx})">${s.name}</button>`;
            }).join('');

            clearTimeout(hideSourcesTimer);
            hideSourcesTimer = setTimeout(() => {
                overlay.style.opacity = '0';
                overlay.style.pointerEvents = 'none';
            }, 4000);
        }

        // Resalta el canal y la fuente activa en el menú lateral
        function updateChannelListActive() {
            document.querySelectorAll('.channel-item').forEach(el => {
                const idx = parseInt(el.getAttribute('data-channel-idx'), 10);
                const ch = allChannels[idx];
                const isActive = currentChannel && ch && currentChannel.name === ch.name;
                el.classList.toggle('active', !!isActive);
                if (isActive) {
                    el.querySelectorAll('.source-chip').forEach((chip, sIdx) => {
                        chip.classList.toggle('active', sIdx === currentSourceIndex);
                    });
                } else {
                    el.querySelectorAll('.source-chip').forEach(chip => chip.classList.remove('active'));
                }
            });
        }

        // Selección de canal
        async function selectChannel(ch, sourceIndex = 0, isUserClick = true) {
            if (isUserClick) {
                hasUserInteracted = true;
                const videoElement = document.getElementById('video');
                if (videoElement) {
                    videoElement.muted = preferredMuted;
                }
            }
            currentChannel = ch;
            currentChannelSources = getChannelSources(ch);
            if (sourceIndex >= currentChannelSources.length) sourceIndex = 0;
            currentSourceIndex = sourceIndex;

            updateSourcesUI();
            updateChannelListActive();

            const selected = currentChannelSources[currentSourceIndex];
            if (!selected) return;

            const u = selected.url;
            const isM3u8 = u.includes('.m3u8');
            const isFlow = u.includes('flow.com.ar') || u.includes('cvattv.com.ar') || 
                           u.includes('/tok_') || u.startsWith('tok_') || 
                           u.startsWith('live/') || u.startsWith('/live/') || 
                           ((ch.flow === 'yes' || ch.flow === true) && !u.includes('http'));
            const streamType = isM3u8 ? 'HLS' : (ch.type || 'CLEARKEY');
            const drmUri = isM3u8 ? '' : (ch.drm_license_uri || '');
            const flowParam = isFlow ? 'yes' : 'no';

            await play(u, streamType, drmUri, flowParam);
        }

        // Cambio de fuente
        async function switchSource(index) {
            if (!currentChannel) return;
            hasUserInteracted = true;
            const videoElement = document.getElementById('video');
            if (videoElement) {
                videoElement.muted = preferredMuted;
            }
            await selectChannel(currentChannel, index, true);
            if (videoElement && videoElement.paused) {
                try { await videoElement.play(); } catch(_) {}
            }
        }

        function onSelectChannel(idx) {
            const ch = allChannels[idx];
            if (ch) selectChannel(ch, 0, true);
        }

        function onSelectChannelSource(idx, sourceIdx) {
            const ch = allChannels[idx];
            if (ch) selectChannel(ch, sourceIdx, true);
        }

        async function init() {
            try {
                const res = await fetch('/canales.json');
                const data = await res.json();
                categoriesData = data.categories || []; 

                allChannels = [];
                const assignIdx = (ch) => {
                    ch._idx = allChannels.length;
                    allChannels.push(ch);
                };
                categoriesData.forEach(cat => {
                    (cat.samples || []).forEach(assignIdx);
                    (cat.subcategories || cat.subCategories || []).forEach(sub => {
                        (sub.samples || []).forEach(assignIdx);
                    });
                });

                render(categoriesData, false); 

                // ==========================================
                // AUTOREPRODUCCIÓN DEL CANAL INICIAL DESDE CONFIG.JSON
                // ==========================================
                let canalDeseado = "DSports";
                try {
                    const configRes = await fetch('/config.json?t=' + Date.now());
                    const configData = await configRes.json();
                    if (configData && configData.canal_inicial) {
                        canalDeseado = configData.canal_inicial.trim();
                    }
                } catch (cfgErr) {
                    console.warn("No se pudo cargar canal_inicial de config.json:", cfgErr);
                }

                let canalEncontrado = null;
                const canalDeseadoLower = canalDeseado.toLowerCase();

                for (const cat of categoriesData) {
                    canalEncontrado = (cat.samples || []).find(ch => (ch.name || '').toLowerCase() === canalDeseadoLower);
                    if (canalEncontrado) break;
                    const subcats = cat.subcategories || cat.subCategories || [];
                    for (const sub of subcats) {
                        canalEncontrado = (sub.samples || []).find(ch => (ch.name || '').toLowerCase() === canalDeseadoLower);
                        if (canalEncontrado) break;
                    }
                    if (canalEncontrado) break;
                }

                if (!canalEncontrado && categoriesData.length > 0) {
                    const firstCat = categoriesData[0];
                    if (firstCat.samples && firstCat.samples.length > 0) {
                        canalEncontrado = firstCat.samples[0];
                    } else if (firstCat.subcategories && firstCat.subcategories.length > 0 && firstCat.subcategories[0].samples && firstCat.subcategories[0].samples.length > 0) {
                        canalEncontrado = firstCat.subcategories[0].samples[0];
                    }
                }

                if (canalEncontrado) {
                    console.log(`Auto-iniciando el canal: ${canalEncontrado.name}`);
                    selectChannel(canalEncontrado, 0, false);
                }

            } catch (error) {
                console.error("Error cargando canales.json:", error);
                document.getElementById('channel-list').innerHTML = '<div style="padding: 15px; color: #ff4d4d;">Error al cargar la lista de canales.</div>';
            }
        }

        // Función para abrir/cerrar categorías principales
        function toggleCategory(index) {
            const content = document.getElementById('cat-content-' + index);
            const icon = document.getElementById('cat-icon-' + index);
            if (!content) return;
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                if (icon) icon.textContent = '▶';
            } else {
                content.classList.add('open');
                if (icon) icon.textContent = '▼';
            }
        }

        // Función para abrir/cerrar subcategorías (provincias)
        function toggleSubcategory(catIndex, subIndex) {
            const content = document.getElementById('subcat-content-' + catIndex + '-' + subIndex);
            const icon = document.getElementById('subcat-icon-' + catIndex + '-' + subIndex);
            if (!content) return;
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                if (icon) icon.textContent = '▶';
            } else {
                content.classList.add('open');
                if (icon) icon.textContent = '▼';
            }
        }

        // Genera el HTML para cada elemento de canal
        function renderChannelItem(ch) {
            const imgUrl = ch.icono || ch.logo || '';
            let imgTag = '';
            if (imgUrl && !imgUrl.startsWith('S<')) {
                imgTag = `<img src="${imgUrl}" class="channel-icon" onerror="this.style.display='none'" loading="lazy">`;
            }
            const sources = getChannelSources(ch);
            let chipsHtml = '';
            if (sources.length > 1) {
                chipsHtml = `
                <div class="channel-chips">
                    ${sources.map((s, sIdx) => `
                        <span class="source-chip ${(currentChannel && currentChannel.name === ch.name && currentSourceIndex === sIdx) ? 'active' : ''}" onpointerdown="event.stopPropagation()" onmousedown="event.stopPropagation()" onclick="event.stopPropagation(); onSelectChannelSource(${ch._idx}, ${sIdx})">F${sIdx + 1}</span>
                    `).join('')}
                </div>`;
            }
            const isActiveChannel = currentChannel && currentChannel.name === ch.name;
            return `
            <div class="channel-item ${isActiveChannel ? 'active' : ''}" data-channel-idx="${ch._idx}" onclick="onSelectChannel(${ch._idx})">
                ${imgTag}
                <div class="channel-info">
                    <span class="channel-name">${ch.name}</span>
                    ${chipsHtml}
                </div>
            </div>
            `;
        }

        // Renderizador con soporte de carpetas principales y subcarpetas (provincias)
        function render(categories, expandAll = false) {
            const container = document.getElementById('channel-list');
            if (!categories || categories.length === 0) {
                container.innerHTML = '<div style="padding: 15px; color: #888;">No se encontraron canales.</div>';
                return;
            }

            container.innerHTML = categories.map((cat, catIndex) => {
                const directChannelsHtml = (cat.samples || []).map(ch => renderChannelItem(ch)).join('');
                const subcats = cat.subcategories || cat.subCategories || [];
                const subcatsHtml = subcats.map((sub, subIndex) => {
                    const subChannelsHtml = (sub.samples || []).map(ch => renderChannelItem(ch)).join('');
                    const isSubOpen = expandAll ? 'open' : '';
                    const subIcon = expandAll ? '▼' : '▶';
                    const count = (sub.samples || []).length;
                    return `
                    <div class="subcategory-header" onclick="toggleSubcategory(${catIndex}, ${subIndex})">
                        <span>📍 ${sub.name} <small style="color:#aaa; font-weight:normal;">(${count})</small></span>
                        <span id="subcat-icon-${catIndex}-${subIndex}" style="font-size: 0.7rem;">${subIcon}</span>
                    </div>
                    <div id="subcat-content-${catIndex}-${subIndex}" class="subcategory-channels ${isSubOpen}">
                        ${subChannelsHtml}
                    </div>
                    `;
                }).join('');

                const isOpenClass = expandAll ? 'open' : '';
                const icon = expandAll ? '▼' : '▶';
                const countBadge = subcats.length > 0 ? `<small style="color:#888; font-weight:normal;">(${subcats.length} prov.)</small>` : '';

                return `
                <div class="category-header" onclick="toggleCategory(${catIndex})">
                    <span>${cat.name} ${countBadge}</span>
                    <span id="cat-icon-${catIndex}" style="font-size: 0.75rem;">${icon}</span>
                </div>
                <div id="cat-content-${catIndex}" class="category-channels ${isOpenClass}">
                    ${directChannelsHtml}
                    ${subcatsHtml}
                </div>
                `;
            }).join('');
        }

        // Buscador inteligente en categorías y subcategorías
        function filter() {
            const q = document.getElementById('search-input').value.toLowerCase().trim();
            if (!q) {
                render(categoriesData, false);
                updateChannelListActive();
                return;
            }

            const filteredCategories = [];
            categoriesData.forEach(cat => {
                const matchingDirect = (cat.samples || []).filter(ch => ch.name.toLowerCase().includes(q));
                const matchingSubcats = [];
                (cat.subcategories || cat.subCategories || []).forEach(sub => {
                    const subMatches = (sub.samples || []).filter(ch => 
                        ch.name.toLowerCase().includes(q) || sub.name.toLowerCase().includes(q)
                    );
                    if (subMatches.length > 0) {
                        matchingSubcats.push({
                            ...sub,
                            samples: subMatches
                        });
                    }
                });

                if (matchingDirect.length > 0 || matchingSubcats.length > 0 || cat.name.toLowerCase().includes(q)) {
                    filteredCategories.push({
                        ...cat,
                        samples: matchingDirect,
                        subcategories: matchingSubcats
                    });
                }
            });

            render(filteredCategories, true);
            updateChannelListActive();
        }

        function ensureHexVal(val) {
            if (!val) return '';
            val = val.trim();
            if (/^[0-9a-fA-F]{32}$/.test(val)) return val.toLowerCase();
            try {
                let b64 = val.replace(/-/g, '+').replace(/_/g, '/');
                while (b64.length % 4) b64 += '=';
                const bin = atob(b64);
                let hex = '';
                for (let i = 0; i < bin.length; i++) {
                    hex += bin.charCodeAt(i).toString(16).padStart(2, '0');
                }
                return hex.toLowerCase();
            } catch(e) {
                return val;
            }
        }

        function sanitizeStreamUrl(rawUrl) {
            try {
                if (!rawUrl || typeof rawUrl !== 'string' || !rawUrl.includes('?')) return rawUrl;
                const urlObj = new URL(rawUrl);
                const params = new URLSearchParams(urlObj.search);
                const keysToDelete = [];
                for (const [key, value] of params.entries()) {
                    if (/^\{.*\}$/.test(value) || /^%7B.*%7D$/i.test(value) || 
                        value.includes('{') || value.includes('}') || 
                        value.toLowerCase().includes('%7b') || value.toLowerCase().includes('%7d') ||
                        key.includes('{') || key.includes('}')) {
                        keysToDelete.push(key);
                    }
                }
                keysToDelete.forEach(k => params.delete(k));
                const newSearch = params.toString();
                urlObj.search = newSearch ? '?' + newSearch : '';
                return urlObj.toString();
            } catch(e) {
                return rawUrl;
            }
        }

        // Función de reproducción (Flow por proxy, resto DIRECTO con rescate)
        async function play(url, type, drm, flow = '') {
            try {
                const videoElement = document.getElementById('video');
                const videoContainer = document.getElementById('player-container');

                // 1. Inicializar Shaka Player solo una vez
                if (!window.player) {
                    window.player = new shaka.Player();
                    await window.player.attach(videoElement);
                    window.ui = new shaka.ui.Overlay(window.player, videoContainer, videoElement);
                    window.ui.configure({
                        controlPanelElements: [
                            'play_pause', 'time_and_duration', 'spacer', 'mute', 
                            'volume', 'fullscreen', 'overflow_menu'
                        ],
                        overflowMenuButtons: ['quality', 'language', 'captions']
                    });

                    videoElement.addEventListener('volumechange', () => {
                        if (hasUserInteracted) {
                            preferredMuted = videoElement.muted;
                        }
                    });

                    // Configuración de fade in / out para el overlay de fuentes según actividad del mouse
                    const playerCont = document.getElementById('player-container');
                    const sourcesOverlay = document.getElementById('sources-overlay');
                    if (playerCont && sourcesOverlay) {
                        playerCont.addEventListener('mousemove', () => {
                            if (currentChannelSources && currentChannelSources.length > 1) {
                                sourcesOverlay.style.opacity = '1';
                                sourcesOverlay.style.pointerEvents = 'auto';
                                clearTimeout(hideSourcesTimer);
                                hideSourcesTimer = setTimeout(() => {
                                    sourcesOverlay.style.opacity = '0';
                                    sourcesOverlay.style.pointerEvents = 'none';
                                }, 4000);
                            }
                        });
                        sourcesOverlay.addEventListener('mouseenter', () => {
                            clearTimeout(hideSourcesTimer);
                            sourcesOverlay.style.opacity = '1';
                            sourcesOverlay.style.pointerEvents = 'auto';
                        });
                        sourcesOverlay.addEventListener('mouseleave', () => {
                            clearTimeout(hideSourcesTimer);
                            hideSourcesTimer = setTimeout(() => {
                                sourcesOverlay.style.opacity = '0';
                                sourcesOverlay.style.pointerEvents = 'none';
                            }, 2000);
                        });
                    }
                }

                // 2. Configurar reintentos e idioma
                window.player.configure({
                    streaming: { retryParameters: { maxAttempts: 3 } },
                    preferredAudioLanguage: 'es',
                    preferredTextLanguage: 'es'
                });

                url = sanitizeStreamUrl(url);
                try { url = decodeURIComponent(url); } catch(e) {}
                url = sanitizeStreamUrl(url);

                // 3. Detección de Flow: ÚNICAMENTE si flow:yes o dominios de Flow
                const isFlow = (String(flow).toLowerCase() === 'yes') ||
                               url.includes('flow.com.ar') || 
                               url.includes('cvattv.com.ar') || 
                               url.includes('/tok_') || 
                               url.startsWith('tok_') || 
                               url.startsWith('/live/') || 
                               url.startsWith('live/');

                let playbackUrl = url;
                if (url.startsWith('http://localhost') || url.startsWith('/pluto/') || url.startsWith('/proxy/')) {
                    playbackUrl = url;
                } else if (isFlow) {
                    let liveIndex = url.indexOf('/live/');
                    if (liveIndex !== -1) {
                        url = url.substring(liveIndex);
                    } else if (url.includes('path=')) {
                        try {
                            const parsed = new URL(url);
                            const realPath = parsed.searchParams.get('path');
                            if (realPath) {
                                const idx = realPath.indexOf('/live/');
                                if (idx !== -1) url = realPath.substring(idx);
                            }
                        } catch(e) {}
                    }
                    if (url.startsWith('tok_') || url.includes('/tok_')) {
                        const parts = url.split('/');
                        const liveIdx = parts.findIndex(p => p.startsWith('live'));
                        if (liveIdx !== -1) url = '/' + parts.slice(liveIdx).join('/');
                    }

                    // Auto-failover para canales c3eds
                    if (url.includes('DSports_2') && url.includes('/SA_Live_dash_enc/')) {
                        url = url.replace(/\/SA_Live_dash_enc\//i, '/SA_Live_dash_enc_wl/');
                    }

                    playbackUrl = url.startsWith('/') ? ('/proxy' + url) : ('/proxy/' + url);
                } else if (url.includes('emitiendoenvivo.com') || url.includes('cloudfront.net') || url.includes('{') || url.includes('%7B') || url.includes('%7b')) {
                    playbackUrl = '/proxy/' + url;
                } else {
                    playbackUrl = url;
                }

                // 4. Configuración de DRM (ClearKey Hex + extracción dinámica de default_KID)
                const isM3u8 = url.includes('.m3u8');
                if (type === 'CLEARKEY' && drm && (!isM3u8 || drm.includes('cenc'))) {
                    const parts = drm.split(',');
                    const kidRaw = parts[0].replace('kid:', '').trim();
                    const keyRaw = (parts[1] || '').replace('k:', '').trim();
                    const kidHex = ensureHexVal(kidRaw);
                    const keyHex = ensureHexVal(keyRaw);

                    const clearKeysObj = {};
                    if (kidHex && keyHex) clearKeysObj[kidHex] = keyHex;

                    if (playbackUrl.includes('.mpd')) {
                        try {
                            const mpdRes = await fetch(playbackUrl);
                            if (mpdRes.ok) {
                                const mpdText = await mpdRes.text();
                                const kidMatch = mpdText.match(/(?:cenc:)?default_KID=["']([a-fA-F0-9-]+)["']/i);
                                if (kidMatch && kidMatch[1]) {
                                    const realKidHex = kidMatch[1].replace(/-/g, '').toLowerCase();
                                    if (keyHex) {
                                        clearKeysObj[realKidHex] = keyHex;
                                    }
                                }
                            }
                        } catch(e) {}
                    }

                    window.player.configure({ 
                        drm: { clearKeys: clearKeysObj } 
                    });
                } else {
                    window.player.configure({ drm: { clearKeys: {} } });
                }

                // 5. Cargar canal: descarga previa sin detach para no resetear el elemento ni el audio
                try {
                    await window.player.unload();
                } catch(_) {}

                try {
                    await window.player.load(playbackUrl);
                } catch(loadErr) {
                    if (!playbackUrl.startsWith('/proxy') && !playbackUrl.startsWith('http://localhost:8000/proxy')) {
                        console.warn("Carga directa falló, reintentando vía proxy de rescate:", loadErr);
                        playbackUrl = '/proxy/' + url;
                        try {
                            await window.player.unload();
                        } catch(_) {}
                        await window.player.load(playbackUrl);
                    } else {
                        throw loadErr;
                    }
                }

                // 6. Audio: si el usuario ya interactuó, se mantiene desmuteado (o el estado de volumen deseado)
                if (hasUserInteracted) {
                    videoElement.muted = preferredMuted;
                } else {
                    videoElement.muted = true;
                }

                try {
                    await videoElement.play();
                } catch(pe) {
                    if (pe.name === 'NotAllowedError') {
                        console.warn("Autoplay con audio bloqueado por navegador, iniciando muted:", pe);
                        videoElement.muted = true;
                        try { await videoElement.play(); } catch(_) {}
                    } else if (pe.name === 'AbortError') {
                        // Play interrumpido por nueva carga; no silenciar
                    } else {
                        console.warn("videoElement.play aviso:", pe);
                    }
                }

                // Guardián contra cuelgues (stall watchdog)
                if (!playbackUrl.startsWith('/proxy') && !playbackUrl.startsWith('http://localhost:8000/proxy')) {
                    const currentLoadUrl = playbackUrl;
                    setTimeout(async () => {
                        if (playbackUrl === currentLoadUrl && videoElement.readyState < 3 && !videoElement.paused) {
                            console.warn("Canal directo no avanza, rescatando por proxy...");
                            playbackUrl = '/proxy/' + url;
                            try {
                                await window.player.unload();
                                await window.player.load(playbackUrl);
                                await videoElement.play();
                            } catch (e) {
                                console.error("Error en failover a proxy:", e);
                            }
                        }
                    }, 3500);
                }
            } catch (e) {
                console.error("Error al reproducir:", e);
            }
        }

        // Iniciar al cargar la página
        init();
    </script>
</body>
</html>
