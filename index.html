<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TV Player v1.3</title>
    <!-- Shaka Player UI CSS y JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
    <style>
body { margin: 0; background-color: #0f0f0f; color: #fff; display: flex; height: 100vh; font-family: sans-serif; overflow: hidden; }
        
        #sidebar { width: 350px; background: #181818; display: flex; flex-direction: column; z-index: 10; }
        #search-input { padding: 15px; background: #222; border: none; color: #fff; outline: none; font-size: 1rem; border-bottom: 1px solid #333; }
        #channel-list { overflow-y: auto; flex: 1; padding: 10px; }
        
        .category-header {
            background: #2a2a2a;
            color: #d1d1d1;
            padding: 12px;
            font-weight: bold;
            font-size: 0.85rem;
            margin-top: 5px;
            margin-bottom: 2px;
            border-radius: 4px;
            border-left: 4px solid #007bff;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            transition: background 0.2s;
        }
        .category-header:hover { background: #353535; }
        
        .category-channels {
            display: none;
            padding-left: 5px;
        }
        .category-channels.open {
            display: block;
        }

        .channel-item { 
            display: flex; 
            align-items: center; 
            padding: 8px 12px; 
            background: #1e1e1e; 
            margin-bottom: 4px; 
            cursor: pointer; 
            border-radius: 6px; 
            transition: background 0.2s;
        }
        .channel-item:hover { background: #333; }
        .channel-icon {
            width: 36px;
            height: 36px;
            object-fit: contain;
            margin-right: 12px;
            border-radius: 4px;
            background: transparent;
        }
        .channel-name {
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        /* Contenedor principal */
/* Contenedor del reproductor */
        #player-container { 
            flex: 1; 
            background: #000; 
            position: relative; 
            overflow: hidden;
        }

        /* Forzamos al contenedor interno de Shaka UI a respetar el tamaño exacto */
        .shaka-video-container {
            width: 100% !important;
            height: 100% !important;
            position: absolute !important;
        }

        /* La clave está aquí: 'contain' muestra el video entero sin recortar nada */
        video { 
            width: 100% !important; 
            height: 100% !important; 
            object-fit: contain !important; 
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <input type="text" id="search-input" placeholder="Buscar canal..." oninput="filter()">
        <div id="channel-list"></div>
    </div>
    
    <!-- Contenedor necesario para Shaka UI -->

    <div id="player-container" data-shaka-player-container style="position: relative; width: 100%; height: 100%;">
    <video id="video" autoplay muted data-shaka-player style="width: 100%; height: 100%; object-fit: contain;"></video>
</div>

    <script>
        let player = null, ui = null, categoriesData = [];

        async function init() {
            try {
                const res = await fetch('/canales.json');
                const data = await res.json();
                categoriesData = data.categories; 
                render(categoriesData, false); 

                // ==========================================
                // AUTOREPRODUCCIÓN DEL CANAL INICIAL
                // ==========================================
                const canalDeseado = "TN"; // Cambia esto por tu canal por defecto
                let canalEncontrado = null;

                for (const cat of categoriesData) {
                    canalEncontrado = cat.samples.find(ch => ch.name === canalDeseado);
                    if (canalEncontrado) break;
                }

                if (!canalEncontrado && categoriesData.length > 0 && categoriesData[0].samples.length > 0) {
                    canalEncontrado = categoriesData[0].samples[0];
                }

                if (canalEncontrado) {
                    const url = encodeURIComponent(canalEncontrado.original_url || canalEncontrado.url);
                    const type = canalEncontrado.type;
                    const drm = canalEncontrado.drm_license_uri || '';
                    
                    console.log(`Auto-iniciando el canal: ${canalEncontrado.name}`);
                    play(url, type, drm);
                }

            } catch (error) {
                console.error("Error cargando canales.json:", error);
                document.getElementById('channel-list').innerHTML = '<div style="padding: 15px; color: #ff4d4d;">Error al cargar la lista de canales.</div>';
            }
        }

        // Función para abrir/cerrar categorías
        function toggleCategory(index) {
            const content = document.getElementById('cat-content-' + index);
            const icon = document.getElementById('cat-icon-' + index);
            
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                icon.textContent = '▶';
            } else {
                content.classList.add('open');
                icon.textContent = '▼';
            }
        }

        // Renderizador de categorías y canales
        function render(categories, expandAll = false) {
            const container = document.getElementById('channel-list');
            
            if (categories.length === 0) {
                container.innerHTML = '<div style="padding: 15px; color: #888;">No se encontraron canales.</div>';
                return;
            }

            container.innerHTML = categories.map((cat, index) => {
                const channelsHtml = cat.samples.map(ch => {
                    const imgUrl = ch.icono || ch.logo || '';
                    let imgTag = '';
                    if (imgUrl && !imgUrl.startsWith('S<')) {
                        imgTag = `<img src="${imgUrl}" class="channel-icon" onerror="this.style.display='none'" loading="lazy">`;
                    }
                    return `
                    <div class="channel-item" onclick="play('${encodeURIComponent(ch.original_url || ch.url)}', '${ch.type}', '${ch.drm_license_uri || ''}')">
                        ${imgTag}
                        <span class="channel-name">${ch.name}</span>
                    </div>
                    `;
                }).join('');

                const isOpenClass = expandAll ? 'open' : '';
                const icon = expandAll ? '▼' : '▶';

                return `
                <div class="category-header" onclick="toggleCategory(${index})">
                    <span>${cat.name}</span>
                    <span id="cat-icon-${index}" style="font-size: 0.75rem;">${icon}</span>
                </div>
                <div id="cat-content-${index}" class="category-channels ${isOpenClass}">
                    ${channelsHtml}
                </div>
                `;
            }).join('');
        }

        function filter() {
            const q = document.getElementById('search-input').value.toLowerCase();
            
            if (!q) {
                render(categoriesData, false); 
                return;
            }

            const filteredCategories = categoriesData.map(cat => {
                return {
                    ...cat,
                    samples: cat.samples.filter(ch => ch.name.toLowerCase().includes(q))
                };
            }).filter(cat => cat.samples.length > 0); 

            render(filteredCategories, true); 
        }

        // Función de reproducción blindada con UI e Idioma Español
async function play(url, type, drm) {
            try {
                const videoElement = document.getElementById('video');
                const videoContainer = document.getElementById('player-container');

                if (window.player) { await window.player.destroy(); window.player = null; }
                videoElement.src = '';

                // Inicialización limpia estándar
                window.player = new shaka.Player();
                await window.player.attach(videoElement);
                
                // Conectamos la interfaz UI directamente a los elementos existentes
                const ui = new shaka.ui.Overlay(window.player, videoContainer, videoElement);
                const controls = ui.getControls();

                window.player.configure({
                    streaming: { retryParameters: { maxAttempts: 3 } },
                    preferredAudioLanguage: 'es',
                    preferredTextLanguage: 'es'
                });

                url = decodeURIComponent(url);
                
                if(type === 'CLEARKEY' && drm) {
                    const parts = drm.split(',');
                    window.player.configure({ 
                        drm: { clearKeys: { [parts[0].replace('kid:', '')]: parts[1].replace('k:', '') } } 
                    });
                } else {
                    window.player.configure({ drm: { clearKeys: {} } });
                }
                
                let liveIndex = url.indexOf('/live/');
                if (liveIndex !== -1) {
                    url = url.substring(liveIndex);
                } else if (url.includes('path=')) {
                    try {
                        const parsed = new URL(url);
                        const realPath = parsed.searchParams.get('path');
                        if (realPath) {
                            const idx = realPath.indexOf('/live/');
                            if (idx !== -1) url = realPath.substring(idx);
                        }
                    } catch(e) {}
                }

                if (url.startsWith('tok_') || url.includes('/tok_')) {
                    const parts = url.split('/');
                    const liveIdx = parts.findIndex(p => p.startsWith('live'));
                    if (liveIdx !== -1) url = '/' + parts.slice(liveIdx).join('/');
                }

                await window.player.load('/proxy' + url);
                
            } catch (e) {
                console.error("Error al reproducir:", e);
            }
        }

        // Arrancar la app
        init();
    </script>
</body>
</html>
