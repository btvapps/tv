<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonchoApps - IPTV Player Completo con Buscador</title>
    <!-- Shaka Player UI -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
    <style>
        body { margin: 0; background-color: #0f0f0f; color: #fff; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 380px; background: #181818; border-right: 1px solid #333; display: flex; flex-direction: column; height: 100%; }
        #sidebar h2 { padding: 15px 20px; margin: 0; font-size: 1.2rem; background: #202020; border-bottom: 1px solid #333; }
        #search-container { padding: 10px; background: #202020; border-bottom: 1px solid #333; }
        #search-input { width: 100%; padding: 8px 12px; box-sizing: border-box; background: #111; border: 1px solid #444; border-radius: 4px; color: #fff; font-size: 0.9rem; outline: none; }
        #search-input:focus { border-color: #e50914; }
        #channel-list { overflow-y: auto; flex: 1; padding: 10px; }
        .category-title { font-size: 0.95rem; font-weight: bold; color: #e50914; padding: 10px 5px 5px 5px; margin-top: 10px; border-bottom: 1px solid #333; }
        .channel-item { display: flex; align-items: center; padding: 10px 12px; margin-top: 6px; background: #222; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .channel-item:hover { background: #333; }
        .channel-item.active { background: #e50914; font-weight: bold; }
        .channel-item img { width: 30px; height: 30px; object-fit: contain; margin-right: 12px; border-radius: 4px; background: #000; }
        .channel-name { font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #player-container { flex: 1; display: flex; justify-content: center; align-items: center; background: #000; position: relative; }
        video { width: 100%; height: 100%; }
        #loading { position: absolute; font-size: 1.2rem; color: #aaa; z-index: 2; text-align: center; }
    </style>
</head>
<body>

    <!-- Panel Lateral con Buscador y Canales -->
    <div id="sidebar">
        <h2>Listado IPTV</h2>
        <div id="search-container">
            <input type="text" id="search-input" placeholder="Buscar canal..." oninput="filterChannels()">
        </div>
        <div id="channel-list">Cargando categorías y canales...</div>
    </div>

    <!-- Contenedor del Reproductor -->
    <div id="player-container">
        <div id="loading">Selecciona un canal de la lista para comenzar</div>
        <video id="video" autoplay controls></video>
    </div>

    <script>
        const JSON_URL = 'https://raw.githubusercontent.com/monchotv/MonchoApps/main/cani_decrypted.json';

        // Token forzado que se inyectará en todas las URLs de Flow
        const FORCED_TOKEN = 'tok_eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9.eyJleHAiOiIxNzg3MzY2NTk1Iiwic2lwIjoiMjAxLjI1Mi42MC41NCIsInBhdGgiOiIvbGl2ZS9jM2Vkcy9FU1BOMkhEL1NBX0xpdmVfZGFzaF9lbmMvIiwic2Vzc2lvbl9jZG5faWQiOiIwYzQwOGIwY2ZiZWY2ZDQ4Iiwic2Vzc2lvbl9pZCI6IjliOGViMmU2N2Q4OGE1ZTA1Mjc5MGI5ZDIzYWIxNmE1LTE3ODcxOTM3OTktNzQ0IiwiY2xpZW50X2lkIjoiZmxvdzo0NDU1NzcwLS1mbG93OjQ0NTU3NzA6UCIsImRldmljZV9pZCI6IjliOGViMmU2N2Q4OGE1ZTA1Mjc5MGI5ZDIzYWIxNmE1IiwibWF4X3Nlc3Npb25zIjowLCJzZXNzaW9uX2R1cmF0aW9uIjowLCJ1cmwiOiJodHRwczovLzE4MS4xMi4zNi4xNTAiLCJhdWQiOiIyNjQiLCJzb3VyY2VzIjpbNzMsODUsMTQ0LDIxMCw4Niw4OF19._yb8g6w6iERtyEzLDoP-D-HxuxINOf3kNlJP-i8Rl6JbaUrIPwS_XvVY8E3wupUylNrv1MZ7Gq4enZ_ZvbxExA==';

        let player, ui;
        let allCategories = []; // Almacenará la data cruda del JSON para reutilizarla al buscar

        function ensureHex(val) {
            if (!val) return '';
            val = val.trim();
            if (/^[0-9a-fA-F]{32}$/.test(val)) return val;
            try {
                let b64 = val.replace(/-/g, '+').replace(/_/g, '/');
                while (b64.length % 4) b64 += '=';
                return Array.from(atob(b64)).map(c => c.charCodeAt(0).toString(16).padStart(2, '0')).join('');
            } catch {
                return val;
            }
        }

        function parseDrmString(drmStr) {
            try {
                if (!drmStr || !drmStr.includes('kid:')) return null;
                const parts = drmStr.split(',');
                const kidRaw = parts[0].replace('kid:', '').trim();
                const keyRaw = parts[1].replace('k:', '').trim();
                return {
                    kid: ensureHex(kidRaw),
                    key: ensureHex(keyRaw)
                };
            } catch (e) {
                console.error("Error parseando DRM:", e);
                return null;
            }
        }

        async function initApp() {
            const video = document.getElementById('video');
            player = new shaka.Player(video);
            ui = new shaka.ui.Overlay(player, document.getElementById('player-container'), video);

            player.addEventListener('error', (err) => console.error("Error en Shaka:", err));

            await loadChannels();
        }

        async function loadChannels() {
            const listContainer = document.getElementById('channel-list');
            try {
                const response = await fetch(JSON_URL);
                allCategories = await response.json(); // Guardamos el JSON original en memoria
                
                renderChannels(allCategories); // Renderizamos por primera vez

            } catch (e) {
                listContainer.innerHTML = 'Error al cargar los canales.';
                console.error(e);
            }
        }

        // Nueva función dedicada a pintar la estructura en el DOM
        function renderChannels(categories) {
            const listContainer = document.getElementById('channel-list');
            listContainer.innerHTML = '';

            categories.forEach((cat) => {
                if (!cat.samples || cat.samples.length === 0) return;

                const catTitle = document.createElement('div');
                catTitle.className = 'category-title';
                catTitle.innerText = cat.name || 'Categoría';
                listContainer.appendChild(catTitle);

                cat.samples.forEach((channel) => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';

                    if (channel.icono && !channel.icono.startsWith('S<')) {
                        const img = document.createElement('img');
                        img.src = channel.icono;
                        img.onerror = () => img.style.display = 'none';
                        item.appendChild(img);
                    }

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'channel-name';
                    nameSpan.innerText = channel.name;
                    item.appendChild(nameSpan);

                    item.addEventListener('click', () => {
                        document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                        item.classList.add('active');
                        playChannel(channel);
                    });

                    listContainer.appendChild(item);
                });
            });
        }

        // Nueva función de filtrado dinámico mediante el input de búsqueda
        function filterChannels() {
            const query = document.getElementById('search-input').value.toLowerCase();
            
            if (!query) {
                renderChannels(allCategories);
                return;
            }

            const filtered = allCategories.map(cat => {
                const matchingSamples = cat.samples.filter(ch => ch.name.toLowerCase().includes(query));
                return {
                    name: cat.name,
                    samples: matchingSamples
                };
            }).filter(cat => cat.samples.length > 0);

            renderChannels(filtered);
        }

        async function playChannel(channelData) {
            document.getElementById('loading').style.display = 'none';

            // 1. Configurar DRM si el canal lo requiere (ClearKey)
            if (channelData.type === 'CLEARKEY' && channelData.drm_license_uri) {
                const keys = parseDrmString(channelData.drm_license_uri);
                if (keys) {
                    player.configure({
                        drm: {
                            clearKeys: {
                                [keys.kid]: keys.key
                            }
                        }
                    });
                    console.log("DRM configurado para:", channelData.name);
                }
            } else {
                player.configure({ drm: { clearKeys: {} } });
            }

            // 2. Forzar la inyección del token y paso por el Proxy
            let streamUrl = channelData.url;

            if (streamUrl.includes('flow-cdn-gcp.app.flow.com.ar') || streamUrl.includes('chromecast.cvattv.com.ar')) {
                try {
                    const urlObj = new URL(streamUrl);
                    // Fuerza la estructura: /flow/tok_.../live/...
                    streamUrl = `/flow/${FORCED_TOKEN}${urlObj.pathname}`;
                } catch (e) {
                    console.warn("No se pudo parsear URL de Flow:", streamUrl);
                }
            }

            console.log("Reproduciendo (Forzado):", channelData.name, "->", streamUrl);

            try {
                await player.load(streamUrl);
                console.log('Reproducción iniciada con éxito');
            } catch (e) {
                console.error('Error al reproducir el stream:', e);
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
